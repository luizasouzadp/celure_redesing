<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="100%" height="100%">
  <defs>
    <!-- Gradiente Principal Verde-Água / Teal Oficial -->
    <linearGradient id="celureTealDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Sombra suave para o fundo claro -->
    <linearGradient id="ribbonShadowLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#115E59" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0D9488" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Tipografia Celure (Versão Dark para fundos claros) -->
  <g transform="translate(10, 0)">
    <text x="10" y="96" 
          fill="#0F172A" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="88" 
          font-weight="800" 
          letter-spacing="-1.5px">Celure</text>

    <!-- Tagline: onde seus sonhos voam -->
    <text x="14" y="136" 
          fill="#0D9488" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="18" 
          font-weight="500" 
          letter-spacing="1.5px">
      onde seus <tspan font-weight="800" fill="#115E59">sonhos</tspan> voam
    </text>

    <!-- Instagram: @celure_turismo -->
    <text x="115" y="158" 
          fill="#64748B" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="13.5" 
          font-weight="600" 
          letter-spacing="0.5px">@celure_turismo</text>
  </g>

  <!-- Monograma 'e' com Seta Ascendente (Traçado Único Limpo) -->
  <g transform="translate(370, -8)">
    <!-- Sombra interna suave da fita -->
    <path d="M 46 95 C 46 62 70 42 100 42 C 126 42 144 60 144 88 C 144 95 138 98 120 98 L 46 98 Z" 
          fill="url(#ribbonShadowLight)" />

    <!-- Traçado Único da Letra 'e' com a Seta Ascendente -->
    <path d="M 38 98 L 138 98 C 138 52 105 24 68 24 C 28 24 12 58 12 98 C 12 142 38 174 88 174 C 132 174 162 140 174 80 L 176 56" 
          fill="none" 
          stroke="url(#celureTealDark)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Ponta da Seta Ascendente -->
    <path d="M 176 42 L 160 66 L 176 58 L 192 66 Z" 
          fill="url(#celureTealDark)" />
  </g>
</svg>
