<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente Principal Verde-Água / Cyan Oficial -->
    <linearGradient id="celureTealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="40%" stop-color="#00DFBA" />
      <stop offset="100%" stop-color="#00C4A7" />
    </linearGradient>

    <!-- Sombra suave para profundidade da fita -->
    <linearGradient id="ribbonShadowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004D40" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#00897B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00DFBA" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    
    <!-- Sombra sutil da dobra interna (efeito 3D suave de fita) -->
    <path d="M 46 95 C 46 62 70 42 100 42 C 126 42 144 60 144 88 C 144 95 138 98 120 98 L 46 98 Z" 
          fill="url(#ribbonShadowGrad)" />

    <!-- Traçado Único Limpo da Letra 'e' com a Seta Ascendente -->
    <path d="M 38 98 L 138 98 C 138 52 105 24 68 24 C 28 24 12 58 12 98 C 12 142 38 174 88 174 C 132 174 162 140 174 80 L 176 56" 
          fill="none" 
          stroke="url(#celureTealGradient)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Ponta da Seta Ascendente no final do traço -->
    <path d="M 176 42 L 160 66 L 176 58 L 192 66 Z" 
          fill="url(#celureTealGradient)" />
          
  </g>
</svg>
