<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.lbl{font-size:12px;letter-spacing:-.3px;color:var(--white-50);line-height:1.3}.v{font-size:11px;color:var(--white-40);font-family:ui-monospace,monospace}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
<div style="display:flex;flex-direction:column;gap:10px"><div class="body-lg" style="color:var(--text-primary)">--text-primary · títulos</div><div class="body-lg" style="color:var(--text-secondary)">--text-secondary · corpo</div><div class="body-lg" style="color:var(--text-tertiary)">--text-tertiary · contadores</div><div class="body-lg" style="color:var(--text-muted)">--text-muted · trecho apagado</div></div>
<div style="display:flex;flex-direction:column;gap:14px"><div><div style="height:1px;background:var(--line-hairline)"></div><div class="lbl" style="margin-top:6px">--line-hairline (white-10) · grids de conteúdo</div></div><div><div style="height:1px;background:var(--line-chrome)"></div><div class="lbl" style="margin-top:6px">--line-chrome (white-20) · header / footer</div></div><div style="display:flex;gap:8px"><div style="flex:1;height:36px;background:var(--surface-raised);border-radius:5rem"></div><div style="flex:1;height:36px;background:var(--surface-inverse);border-radius:5rem"></div></div><div class="lbl">--surface-raised · --surface-inverse (só em pílulas)</div></div></div></body></html>
