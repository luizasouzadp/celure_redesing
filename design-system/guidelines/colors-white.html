<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.lbl{font-size:12px;letter-spacing:-.3px;color:var(--white-50);line-height:1.3}.v{font-size:11px;color:var(--white-40);font-family:ui-monospace,monospace}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:#ffffff;border:1px solid var(--white-10)"></div><div class="lbl" style="color:#fff">--white-100</div><div class="v">#ffffff</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:#ffffff99;border:1px solid var(--white-10)"></div><div class="lbl" style="color:#fff">--white-60</div><div class="v">#ffffff99</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:#ffffff80;border:1px solid var(--white-10)"></div><div class="lbl" style="color:#fff">--white-50</div><div class="v">#ffffff80</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:#ffffff66;border:1px solid var(--white-10)"></div><div class="lbl" style="color:#fff">--white-40</div><div class="v">#ffffff66</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:#ffffff33;border:1px solid var(--white-10)"></div><div class="lbl" style="color:#fff">--white-20</div><div class="v">#ffffff33</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:#ffffff1a;border:1px solid var(--white-10)"></div><div class="lbl" style="color:#fff">--white-10</div><div class="v">#ffffff1a</div></div></div></body></html>
